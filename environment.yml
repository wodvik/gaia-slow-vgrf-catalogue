name: gaia-slow-vgrf
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - numpy
  - scipy
  - pandas
  - astropy>=6.0
  - matplotlib
  - h5py
  - healpy
  - scikit-learn
  - hdbscan
  - joblib
  - tqdm
  - pip
  - pip:
      # AGAMA may require platform-specific compilation; see
      # README-submission.md if pip cannot build it on the target system.
      - agama>=1.0
      - astroquery
      - gaia-zeropoint
      - gaiaunlimited
      - dustmaps
      - diptest
