# Slow-Vgrf catalogue release configuration.
# All scripts in release/v2/scripts/ should read this rather than hardcoding.

# ----- Source catalogue -----
input:
  source_csv: release/data/slow_stars_enriched_orbits.csv
  n_stars_expected: 2859

# ----- Solar / LSR variants -----
# Used by Phase 1C (Vgrf) and Phase 4 (orbits).
solar_variants:
  default:
    R0_kpc: 8.178       # GRAVITY 2019
    z_sun_pc: 25.0      # Bland-Hawthorn & Gerhard 2016
    Vc_kms: 232.0
    U_kms: 11.1         # Schoenrich Binney Dehnen 2010
    V_kms: 12.24
    W_kms: 7.25
  grav22:
    R0_kpc: 8.275       # GRAVITY 2022
    z_sun_pc: 25.0
    Vc_kms: 229.0
    U_kms: 11.1
    V_kms: 12.24
    W_kms: 7.25
  lsr6:
    R0_kpc: 8.178
    z_sun_pc: 25.0
    Vc_kms: 232.0
    U_kms: 11.1
    V_kms: 6.0          # Schoenrich 2012 (low V_LSR)
    W_kms: 7.25
  rb20:
    R0_kpc: 8.178
    z_sun_pc: 25.0
    Vc_kms: 248.5       # Reid & Brunthaler 2020 implicit V_c+V_LSR
    U_kms: 11.1
    V_kms: 12.24
    W_kms: 7.25

# ----- Tier cutoffs (P(Vgrf<25 km/s)) -----
# Headline = Tier B per Phase 0 lock-in.
tiers:
  A: 0.95
  B: 0.84   # HEADLINE
  C: 0.50
  D: 0.0    # point-est < 25 but P <= 0.50

# ----- Vgrf cutoff -----
vgrf_cutoff_kms: 25.0

# ----- MC tiering -----
mc:
  base_realisations: 500
  refine_realisations: 5000     # for P in (0.30, 0.70)
  ultra_realisations: 10000     # for |Vgrf - 25| < 2 km/s point-estimate
  refine_lo: 0.30
  refine_hi: 0.70
  ultra_window_kms: 2.0
  random_seed: 20260502
  n_jobs: -1

# ----- Bar pattern speeds (Phase 3+) -----
bar_pattern_speeds_kms_kpc:
  default: 37.5
  slow: 33.0
  fast: 41.0

# ----- Distance estimator preference (Phase 1B) -----
distance_priority:
  - bailer_jones_2021_photogeo   # VizieR I/352
  - starhorse2_anders_2022       # VizieR I/354
  - inv_parallax_zpcorr          # final fallback

# ----- L21 ZP validity (Lindegren et al. 2021) -----
zpt_validity:
  G_min: 6.0
  G_max: 21.0
  nu_eff_min: 1.1
  nu_eff_max: 1.9
  pseudocolour_min: 1.24
  pseudocolour_max: 1.72
  asp_solved_allowed: [31, 95]

# ----- Compute -----
compute:
  cache_dir: release/v2/cache
  log_dir:   release/v2/logs
  use_joblib: true
